[project]
name = "py-recursive-symlink"
version = "0.1.1"
description = "Follows a chain of symbolic links to its end and reports loops or missing targets."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
